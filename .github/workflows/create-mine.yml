name: Create mine branch

on:
  push:
    branches: [ main ]

jobs:
  setup-mine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create or update mine branch
        run: |
          # اگر برنچ محلی وجود ندارد، آن را بساز
          if git show-ref --verify --quiet refs/heads/mine; then
            echo "Branch 'mine' exists locally. Resetting it to main..."
            git branch -f mine main
          else
            echo "Creating branch 'mine' from main..."
            git checkout -b mine
          fi

          # بررسی وجود برنچ روی ریموت
          if git ls-remote --heads origin mine | grep -q mine; then
            echo "Branch 'mine' exists on remote. Pushing latest changes..."
            git push origin mine --force
          else
            echo "Branch 'mine' does not exist on remote. Creating and pushing..."
            git push -u origin mine
          fi